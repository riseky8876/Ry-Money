plugins {
    id 'com.android.application'
}

def ksPath = System.getenv('RY_KEYSTORE')
def ksPass = System.getenv('RY_STOREPASS')
def keyAlias = System.getenv('RY_KEYALIAS') ?: 'rymoney'

android {
    namespace 'app.rymoney'
    compileSdk 34

    defaultConfig {
        applicationId 'app.rymoney'
        minSdk 29
        targetSdk 34
        versionCode (System.getenv('RY_VERSION_CODE') ?: '1').toInteger()
        versionName System.getenv('RY_VERSION_NAME') ?: '1.0.0'
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias keyAlias
                keyPassword System.getenv('RY_KEYPASS') ?: ksPass
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

// Aset web diambil dari root repo, jadi tidak ada salinan yang perlu dirawat.
def webRoot = file("$rootDir/..")

tasks.register('syncWeb', Sync) {
    from(webRoot) {
        include 'index.html'
        include 'assets/**'
        include 'manifest.webmanifest'
    }
    into layout.projectDirectory.dir('src/main/assets/www')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncWeb')
}
