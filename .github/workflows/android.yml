name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rymoney.p12"
            {
              echo "RY_KEYSTORE=$RUNNER_TEMP/rymoney.p12"
              echo "RY_STOREPASS=$KS_PASS"
              echo "RY_KEYPASS=$KS_PASS"
              echo "RY_KEYALIAS=$KS_ALIAS"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Secret keystore kosong — APK akan ditandatangani dengan kunci debug."
          fi

      - name: Build APK
        env:
          RY_VERSION_CODE: ${{ github.run_number }}
          RY_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Siapkan berkas
        run: cp android/app/build/outputs/apk/release/app-release.apk Ry-Money.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ry-Money-apk
          path: Ry-Money.apk

      - name: Terbitkan ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest \
              --title "Ry-Money APK" \
              --notes "APK terbaru Ry-Money. Unduh Ry-Money.apk, lalu pasang di HP (izinkan instal dari sumber tidak dikenal). Data tersimpan di HP, bukan di server." \
              --latest
          gh release upload apk-latest Ry-Money.apk --clobber
