name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versi Flutter
        run: flutter --version

      - name: Ambil dependensi
        run: flutter pub get

      - name: Analisis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tes
        run: flutter test

      - name: Siapkan keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 kosong; APK tidak bisa menimpa instalasi lama."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rymoney.p12"
          {
            echo "RY_KEYSTORE=$RUNNER_TEMP/rymoney.p12"
            echo "RY_STOREPASS=$KS_PASS"
            echo "RY_KEYPASS=$KS_PASS"
            echo "RY_KEYALIAS=$KS_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Siapkan Android
        run: python3 tool/patch_android.py

      - name: Bangun APK
        run: |
          flutter build apk --release \
            --build-name="1.1.${GITHUB_RUN_NUMBER}" \
            --build-number="$((1000 + GITHUB_RUN_NUMBER))"

      - name: Periksa tanda tangan
        run: |
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Siapkan berkas
        run: cp build/app/outputs/flutter-apk/app-release.apk Ry-Money.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ry-Money-apk
          path: Ry-Money.apk

      - name: Terbitkan ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest \
              --title "Ry-Money APK" \
              --notes "APK Flutter terbaru Ry-Money. Unduh Ry-Money.apk lalu pasang di HP. Data tinggal di HP, tanpa akun dan tanpa internet." \
              --latest
          gh release upload apk-latest Ry-Money.apk --clobber
